name: reader

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: private_reader
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d private_reader"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: chen584991126/qingyue-backend:v0.0.1-beta4
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_STORAGE_ROOT: /app/storage
      APP_SCAN_ROOT: /app/storage/nas
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/private_reader
      SPRING_DATASOURCE_USERNAME: reader
      SPRING_DATASOURCE_PASSWORD: reader
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 1GB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 1100MB
      APP_EAGER_RESOURCE_CACHE_MAX_FILE_SIZE_BYTES: 104857600
      HTTP_PROXY: ${HTTP_PROXY:-http://host.docker.internal:10808}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://host.docker.internal:10808}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,postgres}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    ports:
      - "8080:8080"

  web:
    image: chen584991126/qingyue-web:v0.0.1-beta4
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  postgres-data:

