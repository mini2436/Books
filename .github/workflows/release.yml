name: 多端构建与发布

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 客户端默认连接的后端地址
        required: true
        default: http://localhost:8080
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.6"
  API_BASE_URL: ${{ inputs.api_base_url || 'http://localhost:8080' }}

jobs:
  backend:
    name: 轻阅后端 JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 测试并构建后端
        run: ./gradlew test :app:bootJar
      - name: 整理产物
        run: |
          mkdir -p ../dist
          backend_jar="$(find app/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$backend_jar"
          cp "$backend_jar" ../dist/qingyue-backend.jar
      - uses: actions/upload-artifact@v4
        with:
          name: qingyue-backend
          path: dist/qingyue-backend.jar
          if-no-files-found: error
          retention-days: 14

  docker-image:
    name: 推送 Docker Hub 多架构镜像
    if: startsWith(github.ref, 'refs/tags/v')
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 AMD64 与 ARM64 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            chen584991126/qingyue-backend:${{ github.ref_name }}
            chen584991126/qingyue-backend:latest

  docker-web:
    name: 推送 Docker Hub 前端多架构镜像
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 AMD64 与 ARM64 前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          build-args: |
            API_BASE_URL=/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            chen584991126/qingyue-web:${{ github.ref_name }}
            chen584991126/qingyue-web:latest

  web:
    name: Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Web
        run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: 打包 Web
        run: tar -C build/web -czf private-reader-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: private-reader-web
          path: mobile/private-reader-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK 与 AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建分架构 APK
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: 构建通用 APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: 构建 Android App Bundle
        run: flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/private-reader-android-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/private-reader-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/private-reader-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/private-reader-android-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/private-reader-android.aab
      - name: 上传通用 APK
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-android-universal
          path: mobile/dist/private-reader-android-universal.apk
          if-no-files-found: error
          retention-days: 14
      - name: 上传 Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-android-aab
          path: mobile/dist/private-reader-android.aab
          if-no-files-found: error
          retention-days: 14
      - name: 上传 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-android-arm64-v8a
          path: mobile/dist/private-reader-android-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14
      - name: 上传 ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-android-armeabi-v7a
          path: mobile/dist/private-reader-android-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14
      - name: 上传 x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-android-x86_64
          path: mobile/dist/private-reader-android-x86_64.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Windows
        run: flutter build windows --release --dart-define=API_BASE_URL="$env:API_BASE_URL"
      - name: 打包 Windows
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath private-reader-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: private-reader-windows-x64
          path: mobile/private-reader-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面依赖
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 Linux
        run: flutter build linux --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: 打包 Linux
        run: tar -C build/linux/x64/release/bundle -czf private-reader-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: private-reader-linux-x64
          path: mobile/private-reader-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 构建 macOS App
        run: flutter build macos --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: 拆分 ARM64 与 x86_64 App
        shell: bash
        run: |
          set -euo pipefail

          source_app="build/macos/Build/Products/Release/private_reader_mobile.app"

          thin_app() {
            local arch="$1"
            local target_app="dist/private-reader-macos-${arch}.app"

            ditto "$source_app" "$target_app"
            while IFS= read -r -d '' binary; do
              if file -b "$binary" | grep -q 'Mach-O'; then
                binary_arches="$(lipo -archs "$binary")"
                if [[ " $binary_arches " != *" $arch "* ]]; then
                  echo "错误：$binary 不包含 $arch 架构，现有架构：$binary_arches" >&2
                  exit 1
                fi
                if [[ "$binary_arches" != "$arch" ]]; then
                  lipo "$binary" -thin "$arch" -output "$binary.thin"
                  mv "$binary.thin" "$binary"
                fi
              fi
            done < <(find "$target_app" -type f -print0)

            codesign --force --deep --sign - "$target_app"
            codesign --verify --deep --strict "$target_app"

            while IFS= read -r -d '' binary; do
              if file -b "$binary" | grep -q 'Mach-O'; then
                binary_arches="$(lipo -archs "$binary")"
                if [[ "$binary_arches" != "$arch" ]]; then
                  echo "错误：$binary 拆分后架构异常：$binary_arches" >&2
                  exit 1
                fi
              fi
            done < <(find "$target_app" -type f -print0)
          }

          mkdir -p dist
          thin_app arm64
          thin_app x86_64
      - name: 打包 macOS App
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/private_reader_mobile.app private-reader-macos.zip
          ditto -c -k --sequesterRsrc --keepParent dist/private-reader-macos-arm64.app private-reader-macos-arm64.zip
          ditto -c -k --sequesterRsrc --keepParent dist/private-reader-macos-x86_64.app private-reader-macos-x86_64.zip
      - name: 上传 macOS Universal App
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-macos
          path: mobile/private-reader-macos.zip
          if-no-files-found: error
          retention-days: 14
      - name: 上传 macOS ARM64 App
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-macos-arm64
          path: mobile/private-reader-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: 上传 macOS x86_64 App
        uses: actions/upload-artifact@v4
        with:
          name: private-reader-macos-x86_64
          path: mobile/private-reader-macos-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, docker-image, docker-web, web, android, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
