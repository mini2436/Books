server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the Web entry point aligned with the backend multipart limits. Without
    # this override Nginx rejects request bodies larger than its 1 MB default
    # before Spring can validate large backup archives.
    client_max_body_size 1100m;
    client_body_timeout 1h;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # Stream large uploads to the backend instead of first copying the whole
        # request body to the Web container's temporary filesystem.
        proxy_request_buffering off;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
