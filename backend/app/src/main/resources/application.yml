spring:
  application:
    name: private-reader
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/private_reader}
    username: ${SPRING_DATASOURCE_USERNAME:reader}
    password: ${SPRING_DATASOURCE_PASSWORD:reader}
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:1GB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:1100MB}
  mvc:
    # Streaming backups can legitimately run for several minutes. Keep a
    # bounded but generous timeout so the servlet container does not truncate
    # an otherwise healthy ZIP response at its short default timeout.
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:30m}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage-root: ${APP_STORAGE_ROOT:storage}
  scan-root: ${APP_SCAN_ROOT:storage/nas}
  bootstrap-admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin12345}
  access-token-ttl-minutes: 120
  refresh-token-ttl-days: 30
  eager-resource-cache-max-file-size-bytes: ${APP_EAGER_RESOURCE_CACHE_MAX_FILE_SIZE_BYTES:104857600}

